<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0b0d10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="铜梁龙周报" />
<title>铜梁龙周报 · 重庆铜梁龙</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<link rel="icon" sizes="32x32" href="icon-32.png" />
<style>
  :root{
    --red:#d10c1b; --red2:#8f0512; --ink:#0b0d10;
    --fg:#f2f4f7; --dim:#8b95a5; --line:rgba(255,255,255,.08);
    --gold:#d6b25a; --green:#5ce0a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    overflow-x:hidden;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(209,12,27,.30), transparent 60%),
      radial-gradient(80% 40% at 90% 110%, rgba(209,12,27,.12), transparent 60%),
      var(--ink);
    color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 22px);
    min-height:100%;
  }
  .wrap{width:100%;max-width:520px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .badge{width:40px;height:40px;border-radius:12px;flex:0 0 auto;object-fit:cover;
    box-shadow:0 6px 18px rgba(209,12,27,.35)}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
  .sub{font-size:12px;color:var(--dim);margin-top:2px}
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;backdrop-filter:blur(8px)
  }
  .label{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
  .hero-title{font-size:clamp(20px,6vw,26px);font-weight:800;letter-spacing:.5px;line-height:1.25}
  .hero-title em{font-style:normal;color:#ff8f92}
  .pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.hot{border-color:rgba(209,12,27,.5);color:#ffb4b6;background:rgba(209,12,27,.14)}
  .meta{color:var(--dim);font-size:13px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 12px}
  .big-row{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.1)}
  .big-row div{flex:1;min-width:0}
  .big-row .k{font-size:11px;color:var(--dim);letter-spacing:.08em}
  .big-row .v{font-size:clamp(20px,6.4vw,26px);font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .big-row .v small{font-size:12px;font-weight:500;color:var(--dim);margin-left:3px}
  .count{margin-top:16px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.10);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .count .num{font-size:clamp(26px,8.6vw,34px);font-weight:800;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#ffb4b6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .count .unit{color:var(--dim);font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 .card{min-width:0;margin-bottom:0}
  .stat-big{font-size:clamp(20px,5.6vw,24px);font-weight:800;font-variant-numeric:tabular-nums}
  .stats{color:var(--dim);font-size:12.5px;margin-top:8px;line-height:1.6}
  .stats b{color:#d9dee6}
  /* 最近战绩 */
  .fx{display:grid;grid-template-columns:46px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.055)}
  .fx:last-child{border-bottom:0}
  .fx .d{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;line-height:1.35}
  .fx .d b{display:block;color:#d9dee6;font-size:12.5px;font-weight:650}
  .fx .opp{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;line-height:1.3}
  .fx .sc{font-variant-numeric:tabular-nums;font-weight:750;font-size:14px;white-space:nowrap}
  .fx .sc.w{color:var(--green)}.fx .sc.d{color:var(--gold)}.fx .sc.l{color:#ff8b8d}.fx .sc.t{color:var(--dim);font-weight:600;font-size:12.5px}
  .bc{display:inline-block;font-size:9.5px;line-height:1.5;padding:0 4px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-right:5px;vertical-align:1px}
  .bc.SL{color:#c9b6ff;border-color:rgba(160,130,255,.4)}
  .bc.FA{color:#ffd08a;border-color:rgba(255,170,60,.35)}
  /* 积分榜 */
  .tb{display:grid;gap:2px}
  .tb-row{display:grid;grid-template-columns:24px 1fr 32px 64px 38px;gap:6px;align-items:center;
    font-size:12.5px;padding:6px 4px;border-radius:8px}
  .tb-row .r{color:var(--dim);font-variant-numeric:tabular-nums;text-align:center;font-size:11.5px}
  .tb-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-row .p{text-align:center;font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;white-space:nowrap}
  .tb-row .pts{text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
  .tb-row.me{background:rgba(209,12,27,.16);border:1px solid rgba(209,12,27,.35)}
  .tb-row.me .t{font-weight:750;color:#fff}
  .tb-head{font-size:10px;color:var(--dim);letter-spacing:.1em;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:6px;margin-bottom:4px}
  /* 赛程 */
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--dim);white-space:nowrap}
  .chip.on{background:rgba(209,12,27,.16);border-color:rgba(209,12,27,.5);color:#ffb4b6}
  .month{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:14px 0 2px;text-transform:uppercase}
  footer{color:var(--dim);font-size:11.5px;text-align:center;margin-top:16px;line-height:1.7}
  .btn{display:block;width:100%;margin-top:14px;padding:12px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--fg);font:inherit;font-size:14px;font-weight:600}
  .btn:active{background:rgba(255,255,255,.09)}
  .skeleton{height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.12),rgba(255,255,255,.06));
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .err{color:#ff8b8d;font-size:13px}
  .hidden{display:none!important}
  .dots{display:flex;gap:4px}
  .fd{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800}
  .fd.w{background:rgba(46,204,113,.18);color:var(--green)}
  .fd.d{background:rgba(214,178,90,.18);color:var(--gold)}
  .fd.l{background:rgba(209,12,27,.18);color:#ff8b8d}
  /* 安装引导 */
  .install-tip{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:40;
    display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:16px;
    background:rgba(24,26,32,.96);border:1px solid rgba(255,255,255,.14);
    box-shadow:0 12px 32px rgba(0,0,0,.5);backdrop-filter:blur(10px);animation:tipIn .35s cubic-bezier(.2,1.2,.4,1)}
  @keyframes tipIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .install-tip .ico{width:34px;height:34px;border-radius:10px;overflow:hidden;flex:0 0 auto}
  .install-tip .ico img{width:100%;height:100%;object-fit:cover}
  .install-tip .txt{flex:1;min-width:0;font-size:12.5px;line-height:1.45;color:#c9cfd8}
  .install-tip .txt b{display:block;color:#fff;font-size:13.5px;margin-bottom:1px}
  .install-tip button{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:10px;border:0;background:var(--red);color:#fff}
  .install-tip .close{background:transparent;color:var(--dim);font-size:18px;padding:2px 6px;line-height:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="badge" src="icon-192.png" alt="铜梁龙" width="40" height="40" />
    <div>
      <h1>铜梁龙周报</h1>
      <div class="sub" id="season">重庆铜梁龙 · 加载中…</div>
    </div>
  </header>

  <div class="card" id="heroCard">
    <div class="label" id="heroLabel">Season</div>
    <div class="hero-title" id="heroTitle"><div class="skeleton" style="width:70%"></div></div>
    <div class="meta" id="heroMeta"></div>
    <div class="big-row" id="heroStats"></div>
    <div class="count hidden" id="count"><span class="num" id="cd">--</span><span class="unit" id="cdUnit"></span></div>
  </div>

  <div class="row2">
    <div class="card">
      <div class="label">Last 5</div>
      <div class="dots" id="formDots" style="gap:5px;margin-bottom:8px"></div>
      <div class="stats" id="formMeta">&nbsp;</div>
    </div>
    <div class="card">
      <div class="label">Rank</div>
      <div class="stat-big" id="rankBig">-<small style="font-size:12px;color:var(--dim);font-weight:500;margin-left:4px">位</small></div>
      <div class="stats" id="rankMeta">&nbsp;</div>
    </div>
  </div>

  <div class="card" id="tableCard">
    <div class="label">中超积分榜 · 2026</div>
    <div class="tb" id="tableBox"><div class="skeleton" style="width:80%"></div></div>
  </div>

  <div class="card" id="fixturesCard">
    <div class="label" id="fxLabel">Full schedule</div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="SL">中超</button>
      <button class="chip" data-f="FA">足协杯</button>
      <button class="chip" data-f="home">主场</button>
      <button class="chip" data-f="away">客场</button>
    </div>
    <div id="fixtureList"><div class="skeleton" style="width:80%;margin:8px 0"></div><div class="skeleton" style="width:60%"></div></div>
  </div>

  <button class="btn" id="refresh">刷新</button>
  <div id="err" class="err" style="margin-top:10px"></div>

  <footer>
    <div id="stamp">—</div>
    <div>数据 FotMob · 非官方 · 仅供个人使用</div>
  </footer>
</div>

<div class="install-tip hidden" id="installTip">
  <div class="ico"><img src="icon-192.png" alt="" /></div>
  <div class="txt">
    <b id="itTitle">把周报装到桌面</b>
    <span id="itDesc">装好后点图标直接打开</span>
  </div>
  <button id="itBtn">安装</button>
  <button class="close" id="itClose" aria-label="关闭">×</button>
</div>

<script>
const DATA_URL = 'data.json';
const LS = 'tll:data:v1';
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');

/* 球队/赛事中文名（构建时 data.json 里存的是英文原名） */
const TEAM_CN = {
  'chongqing tongliang long': '重庆铜梁龙', 'beijing guoan': '北京国安', 'chengdu rongcheng fc': '成都蓉城',
  'dalian yingbo': '大连英博', 'henan fc': '河南', 'liaoning tieren': '辽宁铁人', 'ningbo professional': '宁波',
  'qingdao hainiu': '青岛海牛', 'qingdao west coast': '青岛西海岸', 'shandong taishan': '山东泰山',
  'shanghai port': '上海海港', 'shanghai shenhua': '上海申花', 'shenzhen peng city': '深圳新鹏城',
  'tianjin jinmen tiger': '天津津门虎', 'wuhan three towns': '武汉三镇', 'yunnan yukun': '云南玉昆',
  'zhejiang professional': '浙江',
}
const zh = (n) => TEAM_CN[String(n || '').trim().toLowerCase()] || n || ''

let DATA = null;
let filter = 'all';

async function load() {
  if (window.__DATA__) return window.__DATA__;
  const r = await fetch(DATA_URL, { cache: 'no-cache' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function fmtDay(iso) {
  const d = new Date(iso);
  return { md: `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, wd: '周' + ['日', '一', '二', '三', '四', '五', '六'][d.getDay()] };
}

function render() {
  if (!DATA) return;
  const d = DATA;
  $('season').textContent = `重庆铜梁龙 · 中超 ${d.season}`;

  /* 主卡：赛季中显示下一场，赛季结束显示战绩总结 */
  const now = Date.now();
  const next = d.matches.find((m) => new Date(m.utc).getTime() > now - 2 * 3600e3);
  const st = d.leagueStats;

  if (d.seasonOver || !next) {
    $('heroLabel').textContent = 'Season final · 赛季收官';
    $('heroTitle').innerHTML = `中超第 <em>${d.rank ?? '-'}</em> 名`;
    $('heroMeta').innerHTML = `<span class="pill hot">${d.season} 赛季已结束</span><span>新赛季赛程公布后这里会自动更新</span>`;
    $('heroStats').innerHTML = `
      <div><div class="k">战绩</div><div class="v">${st.win}<small>胜</small> ${st.draw}<small>平</small> ${st.loss}<small>负</small></div></div>
      <div><div class="k">进 / 失</div><div class="v">${st.gf}<small>:</small>${st.ga}</div></div>`;
    $('count').classList.add('hidden');
  } else {
    const kd = new Date(next.utc);
    const diff = kd - now;
    const soon = diff < 24 * 3600e3;
    $('heroLabel').textContent = 'Next match · 下一场';
    $('heroTitle').innerHTML = `重庆铜梁龙 <span style="color:var(--dim);font-weight:500;font-size:13px">${next.home ? 'vs' : '@'}</span> ${zh(next.opponent)}`;
    const day = fmtDay(next.utc);
    $('heroMeta').innerHTML = `<span class="pill ${soon ? 'hot' : ''}">${next.home ? '主场' : '客场'}</span>` +
      `<span>${kd.getMonth() + 1}月${kd.getDate()}日 ${day.wd} ${pad(kd.getHours())}:${pad(kd.getMinutes())}</span>` +
      `<span>${next.compName}</span>`;
    $('heroStats').innerHTML = '';
    $('count').classList.remove('hidden');
    tick(kd);
  }

  /* 最近 5 场 */
  const played = d.matches.filter((m) => m.result);
  const last5 = played.slice(-5);
  $('formDots').innerHTML = last5.map((m) =>
    `<span class="fd ${m.result.toLowerCase()}" title="${zh(m.opponent)} ${m.gf}-${m.ga}">${m.result}</span>`).join('');
  $('formMeta').innerHTML = last5.length
    ? `最近一场：${zh(last5[last5.length - 1].opponent)} ${last5[last5.length - 1].gf}-${last5[last5.length - 1].ga}`
    : '暂无';

  $('rankBig').innerHTML = `${d.rank ?? '-'}<small>位</small>`;
  $('rankMeta').innerHTML = `${st.played} 场 · <b>${d.table.find(t => t.rank === d.rank)?.pts ?? '-'}</b> 分<br>${st.win}胜${st.draw}平${st.loss}负`;

  /* 积分榜 */
  $('tableBox').innerHTML = `<div class="tb-row tb-head"><span class="r">#</span><span class="t">球队</span><span class="p">场</span><span class="p">胜-平-负</span><span class="pts">分</span></div>` + d.table.map((t) => {
    const mine = t.rank === d.rank;
    return `<div class="tb-row${mine ? ' me' : ''}">
      <span class="r">${t.rank}</span>
      <span class="t">${zh(t.team)}</span>
      <span class="p">${t.played}</span>
      <span class="p">${t.win}-${t.draw}-${t.loss}</span>
      <span class="pts">${t.pts}</span>
    </div>`
  }).join('');

  $('stamp').textContent = '更新于 ' + new Date(d.generatedAt).toLocaleString('zh-CN', { hour12: false });
  renderFixtures();
}

function tick(kd) {
  const step = () => {
    const diff = kd - Date.now();
    if (diff <= 0) { $('cd').textContent = '已开球'; $('cdUnit').textContent = ''; return; }
    const dd = Math.floor(diff / 86400e3), h = Math.floor(diff % 86400e3 / 36e5);
    const m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1000);
    $('cd').textContent = dd > 0 ? `${dd}天 ${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(h)}:${pad(m)}:${pad(s)}`;
    $('cdUnit').textContent = dd > 0 ? '' : '小时:分:秒';
  };
  step(); setInterval(step, 1000);
}

function renderFixtures() {
  if (!DATA) return;
  const box = $('fixtureList');
  const list = DATA.matches.filter((m) => {
    if (filter === 'all') return true;
    if (filter === 'home') return m.home;
    if (filter === 'away') return !m.home;
    if (filter === 'FA') return m.compName === '足协杯';
    return m.compName === '中超';
  });
  $('fxLabel').textContent = `Full schedule · ${list.length} 场`;
  if (!list.length) { box.innerHTML = '<div class="stats">这个筛选下没有比赛</div>'; return }

  const out = [];
  let month = '';
  for (const m of list) {
    const day = fmtDay(m.utc);
    const key = m.utc.slice(0, 7);
    if (key !== month) { month = key; out.push(`<div class="month">${Number(key.slice(0, 4))} 年 ${Number(key.slice(5, 7))} 月</div>`) }
    const cls = m.result ? m.result.toLowerCase() : 't';
    const right = m.goalDiffText = m.result
      ? `<span class="sc ${cls}">${m.gf}-${m.ga}</span>`
      : `<span class="sc t">${pad(new Date(m.utc).getHours())}:${pad(new Date(m.utc).getMinutes())}</span>`
    out.push(`<div class="fx">
      <div class="d"><b>${day.md}</b>${day.wd}</div>
      <div><div class="opp"><span class="bc ${m.compName === '足协杯' ? 'FA' : 'SL'}">${m.compName}</span>${m.home ? '主' : '客'} ${zh(m.opponent)}</div></div>
      <div>${right}</div>
    </div>`)
  }
  box.innerHTML = out.join('');
}

$('chips').addEventListener('click', (ev) => {
  const b = ev.target.closest('.chip');
  if (!b) return;
  filter = b.dataset.f;
  for (const c of $('chips').children) c.classList.toggle('on', c === b);
  renderFixtures();
});

async function boot(silent = false) {
  const cached = JSON.parse(localStorage.getItem(LS) || 'null');
  if (cached) { DATA = cached; render(); }
  try {
    DATA = await load();
    localStorage.setItem(LS, JSON.stringify(DATA));
    $('err').textContent = '';
    render();
  } catch (e) {
    if (!silent) $('err').textContent = cached ? `刷新失败（${e.message}），显示的是上次数据` : `拉取失败：${e.message}`;
  }
}

$('refresh').addEventListener('click', async () => {
  $('refresh').textContent = '刷新中…';
  await boot();
  $('refresh').textContent = '刷新';
});

/* 每 5 分钟静默刷新一次（赛季中比分变化时才看得到差别） */
setInterval(() => { if (document.visibilityState === 'visible') boot(true); }, 5 * 60 * 1000);

/* 安装引导 */
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isWeChat = () => /micromessenger/i.test(navigator.userAgent);
const isAndroid = () => /android/i.test(navigator.userAgent);

function showInstallTip(mode) {
  if (isStandalone() || localStorage.getItem('tll:installTipDismissed')) return;
  const tip = $('installTip'), title = $('itTitle'), desc = $('itDesc'), btn = $('itBtn');
  if (mode === 'android' && deferredInstall) {
    title.textContent = '把周报装到桌面'; desc.textContent = '点右边按钮，桌面会多一个图标'; btn.textContent = '安装'; btn.style.display = '';
  } else if (mode === 'ios') {
    title.textContent = '装到桌面更像 App'; desc.innerHTML = '点底部 <b style="display:inline;color:#fff">分享 ⤴</b> → 往下翻 → <b style="display:inline;color:#fff">添加到主屏幕</b>'; btn.style.display = 'none';
  } else if (mode === 'wechat') {
    title.textContent = '微信里装不了'; desc.textContent = '点右上角 ··· → 在浏览器打开'; btn.style.display = 'none';
  } else if (mode === 'android-menu') {
    title.textContent = '装到桌面更像 App'; desc.innerHTML = '点浏览器右上角 <b style="display:inline;color:#fff">⋮</b> → <b style="display:inline;color:#fff">安装应用</b>'; btn.style.display = 'none';
  } else return;
  tip.classList.remove('hidden');
}
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; showInstallTip('android'); });
window.addEventListener('appinstalled', () => { $('installTip').classList.add('hidden'); localStorage.setItem('tll:installTipDismissed', 'installed'); });
$('itBtn').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  $('installTip').classList.add('hidden');
});
$('itClose').addEventListener('click', () => { $('installTip').classList.add('hidden'); localStorage.setItem('tll:installTipDismissed', '1'); });
setTimeout(() => {
  if (!$('installTip').classList.contains('hidden')) return;
  if (isWeChat()) showInstallTip('wechat');
  else if (isIOS()) showInstallTip('ios');
  else if (isAndroid()) showInstallTip('android-menu');
}, 2500);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => { reg.update().catch(() => {}); }).catch(() => {});
}
boot();
</script>
</body>
</html>
